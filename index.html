<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps</title>
<style>
  :root {
    --bg: #f6f7f5;
    --card-bg: #ffffff;
    --text: #1c1f1b;
    --text-sub: #56605a;
    --border: #e2e6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card-bg: #1e2228;
      --text: #eef1ee;
      --text-sub: #a7b0aa;
      --border: #2c3138;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    padding: 0 20px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 0 48px;
  }
  h1 { font-size: 24px; margin: 0 0 32px; }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
  }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card p { margin: 0; font-size: 14px; color: var(--text-sub); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Apps</h1>
    <a class="card" href="/puttsense/">
      <h2>PuttSense</h2>
      <p>パター練習支援アプリ — サポート・プライバシーポリシー</p>
    </a>
  </div>
</body>
</html>
